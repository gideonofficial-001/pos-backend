services:
  - type: web
    name: njugush-pos-backend
    env: node
    plan: starter
    region: oregon
    buildCommand: cd backend && npm install --production=false && npx prisma generate && npx prisma db push && node prisma/seed.js && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: njugush-pos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        value: https://njugush-ent.vercel.app
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  - type: web
    name: njugush-pos-frontend
    env: static
    plan: starter
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://pos-backend-dffl.onrender.com/api
    routes:
      - type: rewrite
        source: /.*
        destination: /index.html

databases:
  - name: njugush-pos-db
    plan: starter
    region: oregon
    databaseName: njugush_pos
    user: njugush_admin
    ipAllowList: []
    
